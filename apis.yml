x-coverage:
  state: gated
  reason: tenant_only
  detail: >-
    Griffith University publishes no institution-authored API contract and operates no developer
    portal. A DNS-based operator audit on 2026-09-01 resolved every machine-readable surface on a
    griffith.edu.au hostname onto a vendor platform — research-repository -> atmire.com,
    lms -> instructure.com, experts -> symplectic.org — so all three are recorded as tenancies rather
    than as Griffith contracts. The institution's own engineering identity is its SAML 2.0 Shibboleth
    IdP in the Australian Access Federation, exported to eduGAIN, which is recorded as `federation`
    and is genuinely Griffith's. Three registry memberships (DataCite provider `griffith`, Crossref
    member 5850, ROR 02sc3r913) are recorded as facts about Griffith, never as Griffith contracts.
    Administrative, course-catalog, timetable and registrar interfaces were hunted and none resolve
    publicly — api., data., courses., programs-courses., timetable., library., sso. and idp. under
    griffith.edu.au all return NXDOMAIN. The Canvas REST API is live but authenticated (401). The
    main www host sits behind a Cloudflare managed challenge (403, cf-mitigated: challenge) for every
    non-browser client, including with full browser headers over HTTP/2, so llms.txt, robots.txt and
    .well-known probes could not be completed there; that is a finding about the edge, not a gap in
    Griffith's publishing. No OpenAPI, AsyncAPI or apis.json artifact is saved for Griffith because
    none belonging to Griffith exists.
