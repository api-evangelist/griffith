x-category: Public Research University
description: >-
  Griffith University is a public research university in South East Queensland, Australia, a member
  of the Innovative Research Universities (IRU) network and ranked #255 in the QS World University
  Rankings 2025. Griffith operates no public developer portal and publishes no institution-authored
  API contract; a 2026-09-01 operator audit found that every machine-readable surface running under
  a griffith.edu.au hostname is a vendor platform under a Griffith tenancy, confirmed by DNS. Griffith
  Research Online (research-repository.griffith.edu.au) is a DSpace 7.6 repository hosted by Atmire,
  serving a live REST API and a fully conformant OAI-PMH 2.0 endpoint over Griffith's own research
  outputs. lms.griffith.edu.au is an Instructure Canvas tenancy exposing an LTI 1.3 keyset and an
  OpenID Connect discovery document, with the REST API itself behind authentication. Griffith Experts
  (experts.griffith.edu.au) is a Symplectic Discovery deployment. The one surface that is
  unambiguously Griffith's own engineering identity is its SAML 2.0 Shibboleth Identity Provider,
  registered in the Australian Access Federation and exported to eduGAIN with REFEDS Research &
  Scholarship, Code of Conduct v2 and SIRTFI assertions. Griffith is additionally a registrant in
  DataCite, Crossref and ROR. The main website sits behind a Cloudflare managed challenge and is
  unreadable to non-browser clients.
