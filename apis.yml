apis:
  - aid: griffith:aaf-idp
    name: Griffith University SAML Identity Provider (AAF / eduGAIN)
    description: >-
      Griffith's SAML 2.0 Shibboleth Identity Provider, entityID
      https://idp1.griffith.edu.au/idp/shibboleth, registered in the Australian Access Federation on
      2023-03-06 and exported to eduGAIN as entity 673155. Scope griffith.edu.au. Asserts REFEDS
      Research & Scholarship, anonymous/pseudonymous/personalized, GEANT Data Protection Code of
      Conduct v1, REFEDS Code of Conduct v2, and SIRTFI assurance. Machine-readable SAML metadata is
      public at both the AAF aggregate and the institution's own host. Griffith also registers eight
      Service Providers in AAF under OrganizationName griffith.edu.au, of which only AusNC still
      resolves.
